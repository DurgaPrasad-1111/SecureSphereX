<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SecureSphere X</title>
  <style>
    :root {
      --bg:#f6f7f9; --panel:#ffffff; --ink:#1b1f24; --muted:#5b6570; --line:#e3e6ea;
      --safe:#1a7f37; --caution:#bf8700; --danger:#cf222e;
      --safe-bg:#e9f5ec; --caution-bg:#fbf3df; --danger-bg:#fbe9ea;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#14171a; --panel:#1e2226; --ink:#e6e9ec; --muted:#9aa4ae; --line:#2c3238;
        --safe-bg:#12241a; --caution-bg:#2a2410; --danger-bg:#2a1416; }
    }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--ink);
      font:14px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
    .wrap { max-width:960px; margin:0 auto; padding:24px 20px 64px; }
    header h1 { font-size:20px; margin:0 0 2px; }
    header p { margin:0 0 20px; color:var(--muted); font-size:13px; }
    section { background:var(--panel); border:1px solid var(--line); border-radius:10px;
      padding:16px 18px; margin:0 0 18px; }
    section > h2 { font-size:14px; text-transform:uppercase; letter-spacing:.04em;
      color:var(--muted); margin:0 0 12px; display:flex; justify-content:space-between; align-items:center; }
    .empty, .rn-empty, .none { color:var(--muted); font-size:13px; }
    .badge { display:inline-block; padding:2px 10px; border-radius:999px; font-weight:600; font-size:12px; }
    .badge.tier-Low { background:var(--safe-bg); color:var(--safe); }
    .badge.tier-Medium { background:var(--caution-bg); color:var(--caution); }
    .badge.tier-High { background:var(--danger-bg); color:var(--danger); }
    .rn { border-left:4px solid var(--line); padding-left:14px; }
    .rn.tier-Low { border-color:var(--safe); } .rn.tier-Medium { border-color:var(--caution); }
    .rn.tier-High { border-color:var(--danger); }
    .rn-head { display:flex; gap:10px; align-items:center; margin-bottom:8px; }
    .rn-host { font-weight:600; word-break:break-all; }
    ul.techniques { list-style:none; margin:6px 0 0; padding:0; }
    ul.techniques li { padding:4px 0; border-top:1px solid var(--line); }
    .tname { font-weight:600; }
    .rid { font:11px ui-monospace,Menlo,Consolas,monospace; color:var(--muted);
      background:var(--bg); border:1px solid var(--line); border-radius:4px; padding:0 5px; margin-left:6px; }
    table { width:100%; border-collapse:collapse; font-size:13px; }
    th { text-align:left; color:var(--muted); font-weight:600; font-size:11px;
      text-transform:uppercase; letter-spacing:.03em; border-bottom:1px solid var(--line); padding:6px 8px; }
    td { padding:7px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
    td.when { color:var(--muted); white-space:nowrap; font-variant-numeric:tabular-nums; }
    td.site { word-break:break-all; }
    .state.ESTABLISHED { color:var(--safe); font-weight:600; }
    .state.PROVISIONAL { color:var(--caution); font-weight:600; }
    button { font:inherit; cursor:pointer; border:1px solid var(--line); background:var(--bg);
      color:var(--ink); border-radius:6px; padding:4px 12px; }
    button:hover { border-color:var(--muted); }
    button.danger { color:var(--danger); }
    .cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:12px; }
    .card { border:1px solid var(--line); border-radius:8px; padding:12px 14px; background:var(--bg); }
    .card-head { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px; }
    .card p { margin:0; color:var(--muted); font-size:13px; }
    .card .rid { margin:0; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>SecureSphere X</h1>
      <p>Local phishing protection. Analysis runs on your device; no browsing data leaves it.</p>
    </header>

    <section id="rightnow-section">
      <h2>Right now</h2>
      <div id="rightnow"></div>
    </section>

    <section>
      <h2>History <button id="clear-history" class="danger">Clear all</button></h2>
      <div id="incidents"></div>
    </section>

    <section>
      <h2>Saved sites</h2>
      <div id="saved"></div>
    </section>

    <section>
      <h2>Techniques we look for</h2>
      <div id="techniques"></div>
    </section>
  </div>
  <script src="dashboard.js"></script>
</body>
</html>
