openapi: 3.1.0
info:
  title: SecureSphere X API
  version: 1.2.0
  summary: Projection of the frozen SecureSphere X architecture into HTTP.
  description: 'Generated from Backend Architecture v1.3, Canonical Boundary Contracts D0.10 v1.1.0, and
    API Contract v1.2.


    This document is a projection, not a source of architectural truth. Canonical-backed schemas are generated
    from the D0.x TypeScript contracts and referenced by `$ref`; none is hand-written (API Contract §18.1).


    Two behaviours depart from HTTP convention and are architectural: evaluation unavailability returns
    200 with a possibly-null body rather than 503, and an over-long k-anonymity prefix is rejected rather
    than truncated.'
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
- url: https://{host}/
  variables:
    host:
      default: api.securesphere.example
tags:
- name: Analysis
  description: Backend v1.3 §5.1 — Analysis Controller
- name: Intervention
  description: Backend v1.3 §5.2 — Intervention Controller
- name: Intelligence
  description: Backend v1.3 §5.3 — Threat Intelligence Controller
- name: RuleSet
  description: Backend v1.3 §5.4 — Rule Distribution Controller
- name: Dashboard
  description: Backend v1.3 §5.5 — Dashboard Controller
- name: Identity
  description: Backend v1.3 §5.6 — Identity Controller
- name: Health
  description: Backend v1.3 §5.7 — Health and Readiness Controller
paths:
  /v1/analysis/sessions/{sessionId}/gates:
    post:
      operationId: submitGate
      summary: Submit accumulated evidence at a Tier 2 gate
      description: Materialises the Analysis Session under the client-generated identifier — there is
        no session creation endpoint (AC-4). Evidence for Tier 0, 1 and 2 is submitted together; the backend
        reconstructs the pass sequence. Idempotent on (sessionId, gateOrdinal).
      tags:
      - Analysis
      security: &id001
      - extensionCredential: []
      parameters:
      - &id002
        name: sessionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Client-generated at navigation (Backend v1.3 §4.3). Authoritative over any body value.
      - &id009
        name: X-Contract-Version
        in: header
        required: true
        schema:
          type: string
        description: API Contract v1.2 §9.2. Mismatch yields 409.
      - &id003
        name: X-Correlation-Id
        in: header
        required: false
        schema:
          type: string
        description: Optional; generated when absent and echoed on every response.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GateSubmission'
      responses:
        '200':
          description: Evaluated, or evaluation unavailable. Where the evaluation path is unavailable
            the response is 200 with a degraded view, or a literal null body when no prior state exists
            (API Contract §11.4). 503 is NOT used for evaluation unavailability.
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/SecurityStateView'
                - type: 'null'
        '409':
          description: Contract version mismatch, session finalised, gate ordinal not dense, or submission
            in flight.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Payload exceeds bounds.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: Content type not application/json.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401': &id004
          $ref: '#/components/responses/Unauthenticated'
        '403': &id005
          $ref: '#/components/responses/Forbidden'
        '422': &id006
          $ref: '#/components/responses/ValidationFailed'
        '429': &id007
          $ref: '#/components/responses/RateLimited'
        '503': &id008
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/analysis/sessions/{sessionId}/state:
    get:
      operationId: getCurrentState
      summary: Retrieve current security state
      description: Returns the platform's present belief for the session. Read-your-writes after a gate
        response.
      tags:
      - Analysis
      security: *id001
      parameters:
      - *id002
      - *id003
      responses:
        '200':
          description: Current state, or null where none has been committed.
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/SecurityStateView'
                - type: 'null'
        '404':
          description: Session not materialised — no gate has been submitted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401': *id004
        '403': *id005
        '422': *id006
        '429': *id007
        '503': *id008
  /v1/analysis/sessions/{sessionId}/finalization:
    post:
      operationId: finalizeSession
      summary: Finalise an Analysis Session
      description: Finalises the session. Report metadata is created as a side effect within the same
        unit of work (AC-5); there is no report creation endpoint. Idempotent.
      tags:
      - Analysis
      security: *id001
      parameters:
      - *id002
      - *id003
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinalizationRequest'
      responses:
        '204':
          description: Finalised, or already finalised.
        '404':
          description: Session not materialised.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401': *id004
        '403': *id005
        '422': *id006
        '429': *id007
        '503': *id008
  /v1/analysis/sessions/{sessionId}/interventions:
    post:
      operationId: reportIntervention
      summary: Report that an intervention was presented
      description: Sets the intervention lock on the corresponding pass. Accepts no tier, score or finding
        (Backend v1.3 §5.2, BI-32) — the backend already holds the tier it computed. Idempotent on (sessionId,
        interventionOrdinal).
      tags:
      - Intervention
      security: *id001
      parameters:
      - *id002
      - *id009
      - *id003
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InterventionReport'
      responses:
        '204':
          description: Recorded.
        '404':
          description: Session not materialised.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: No committed pass corresponds to this intervention.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401': *id004
        '403': *id005
        '422': *id006
        '429': *id007
        '503': *id008
  /v1/analysis/sessions/{sessionId}/interventions/{interventionOrdinal}/disposition:
    put:
      operationId: reportDisposition
      summary: Report the user disposition for an intervention
      description: Recorded as an audit event; not persisted as domain data (Backend v1.3 §5.2, §10.10).
        Guard G-02 is enforced client-side and does not depend on this report.
      tags:
      - Intervention
      security: *id001
      parameters:
      - *id002
      - name: interventionOrdinal
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
      - *id009
      - *id003
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DispositionReport'
      responses:
        '204':
          description: Recorded as an audit event.
        '404':
          description: Session or intervention not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401': *id004
        '403': *id005
        '422': *id006
        '429': *id007
        '503': *id008
  /v1/intelligence/lookups:
    post:
      operationId: lookupIntelligence
      summary: k-anonymity prefix lookup
      description: POST is used so the prefix does not appear in access, proxy or browser-history logs.
        The operation has no side effect and may be retried freely. The prefix length must equal the configured
        value exactly; a longer prefix is rejected, never truncated (API Contract §15.4).
      tags:
      - Intelligence
      security: *id001
      parameters:
      - *id003
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IntelligenceLookupRequest'
      responses:
        '200':
          description: 'Every entry in the prefix bucket. Final matching occurs client-side.


            BODY NOT SPECIFIED — no frozen document enumerates it. Recorded as an Architecture Change
            Request; nothing is invented here. See Translation Issues Log.'
        '401': *id004
        '403': *id005
        '422': *id006
        '429': *id007
        '503': *id008
