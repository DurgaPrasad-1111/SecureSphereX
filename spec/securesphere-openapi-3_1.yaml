        '422': *id006
        '429': *id007
        '503': *id008
  /v1/dashboard/history:
    get:
      operationId: getHistory
      summary: Saved analysis history
      description: Returns the sessions the user has explicitly saved. No user-session association exists
        in the model, so this is the whole of what a user owns (API Contract §6.1). Cursor-paginated.
      tags:
      - Dashboard
      security: &id010
      - userToken: []
      parameters:
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
      - name: tier
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/RiskTier'
      - name: from
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: to
        in: query
        required: false
        schema:
          type: string
          format: date
      - *id003
      responses:
        '200':
          description: A page of saved history entries.
          content:
            application/json:
              schema:
