components:
  securitySchemes:
    extensionCredential:
      type: http
      scheme: bearer
      description: Build-embedded extension credential, presented on each request (Backend v1.3 §10.1.1).
        There is no token exchange and no enrolment endpoint. The credential identifies the build, not
        the installation, is assumed public, and is therefore not a rate-limiting key — limits are keyed
        on source address (CR-1).
    userToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Asymmetrically signed JWT (EdDSA or RS256) with a rotating refresh token and reuse
        detection (Backend v1.3 §10.7).
  responses:
    Unauthenticated:
      description: Authentication absent, expired or invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Authenticated but not permitted — wrong principal type, or resource not owned. An unowned
        resource yields 403, never 404 (API Contract §6.2).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationFailed:
      description: Schema or semantic validation failure. Unknown fields are rejected, never ignored.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimited:
      description: Rate limit exceeded. Keyed on source address for extension surfaces.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServiceUnavailable:
      description: Database or dependency unavailable. Never used for evaluation unavailability.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    CollectionContext:
      type: object
      description: Canonical `CollectionContext` (D0.x), generated. Never hand-written (§18.1).
      properties:
        collector:
          $ref: '#/components/schemas/CollectorKind'
        collectorVersion:
          type: string
        tier:
          type: integer
          enum:
          - 0
          - 1
          - 2
