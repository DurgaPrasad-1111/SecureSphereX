  /v1/rulesets/{ruleSetVersion}:
    get:
      operationId: getRuleSet
      summary: Fetch a released rule-set artifact
      description: A released version is immutable and may be cached indefinitely. An unreleased version
        is never served.
      tags:
      - RuleSet
      security: *id001
      parameters:
      - name: ruleSetVersion
        in: path
        required: true
        schema:
          type: string
      - *id003
      responses:
        '200':
          description: The rule-set artifact.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuleSet'
        '404':
          description: Unknown version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Version exists but is not released.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Integrity verification failed; an alert is raised.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401': *id004
        '403': *id005
        '422': *id006
        '429': *id007
        '503': *id008
  /v1/rulesets/{ruleSetVersion}/digest:
    get:
      operationId: getRuleSetDigest
      summary: Fetch a rule-set integrity digest
      description: Immutable.
      tags:
      - RuleSet
      security: *id001
