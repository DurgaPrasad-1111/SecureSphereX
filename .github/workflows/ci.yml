# Working CI configuration. Derived from spec/ci.yml per DEC-4 (G-8/G-11
# rename; G-1 fix for DEFECT-1). spec/ci.yml is frozen audit baseline and is
# NOT edited.

name: CI

# SecureSphere X — Stage 0 CI baseline (D0.7)
#
# Gates G-1 … G-7 run from day one, before there is anything to break.
# Retrofitting architectural checks after drift has occurred is materially
# harder than establishing them empty.
#
# G-8 (rule-set static validation) activates on the first rule set.
# G-9 (property tests) activates in Stage 1b.
# G-10 (deterministic replay) activates in Stage 6.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # ── G-1 — contract integrity ─────────────────────────────────────
      - name: 'G-1  Typecheck (strict)'
        run: npm run typecheck

      # G-1's Lint sub-check IS genuinely specified in the frozen CI baseline
      # from the start (both 'G-1 Typecheck' and 'G-1 Lint' appear there,
      # unchanged since before Step 12) — not scope creep; the gap is that no
      # eslint.config.js has ever been authored to satisfy it (DEFECT-12).
      # Deferred, not removed, via the same hashFiles-guard pattern already
      # used for G-8 below. (Separately: G-2's Origin-cast check is NOT
      # currently implemented at all — tools/ci/architectural-gates.mjs,
      # referenced below, has never existed; tracked as DEFECT-13.)
      - name: 'G-1  Lint'
        if: hashFiles('eslint.config.js') != ''
        run: npx eslint . --max-warnings=0

      # ── G-2, G-3, G-6 — architectural invariants ─────────────────────
      #
      # G-2  Origin casts       — §20.3 origin-only persistence
      # G-3  Engine purity      — §17.2 replay viability
      # G-6  Transmission audit — §20.2 never-transmit (heuristic only —
      #                            not real reachability analysis; see
      #                            DEFECT-14. Does not fail the build.)
      - name: 'G-2 G-3 G-6  Architectural gates'
        run: node tools/ci/architectural-gates.mjs

      # ── G-4, G-5 — package boundaries and store access ───────────────
      - name: 'G-4 G-5  Dependency boundaries'
        run: npx depcruise --config .dependency-cruiser.cjs packages apps tools

      # ── G-7 — contract shape stability ───────────────────────────────
      - name: 'G-7  Fixture round-trip'
        run: npm run test:fixtures

      # ── G-8 — rule-set static validation (§17.5) ─────────────────────
      #
      # V-1 … V-13 from D0.3 §8, plus V-14 (integrityDigest, DEFECT-17) and
      # V-15 (pslVersion reconciliation, DEC-27), which exist only in
      # validate-ruleset.py and not in the contract — fifteen in total.
      #
      # V-6 machine-checks the layered-security invariant (§1.5): no primary
      # rule's base weight reaches the High threshold. A PATCH-level weight
      # change can violate it trivially, so it is checked rather than trusted
      # to review.
      - name: 'G-8  Rule-set static validation'
        if: hashFiles('rulesets/*.json') != ''
        run: npm run validate:ruleset

      # ── G-8 / V-15 companion — PSL boundary conformance (DEC-27 3b) ───
      #
      # V-15 (inside validate:ruleset above) gates that the declared pslVersion
      # and the extractor's bundled PSL are pinned and their PAIRING has been
      # reconciled. It deliberately does NOT compare the two version strings —
      # `tldextract==5.3.0` and `tldts@7.4.11` are different libraries and are
      # not comparable.
      #
      # THIS step is the empirical half: it runs both libraries' answers over a
      # fixed set of registrable-domain boundaries and requires agreement.
      # Without it V-15 would only prove the two sides are pinned, not that they
      # AGREE — and `registrableDomain` is the field CRED-01 and CRED-07 key on.
      #
      # No `--if-present`: DEFECT-29's lesson. If the script is removed this
      # step MUST fail rather than pass vacuously.
      #
      # ── WHY THE PIP INSTALL IS LOAD-BEARING, NOT CONVENIENCE ──────────
      #
      # V-15's two constants (BUNDLED_PSL, PSL_RECONCILED_AGAINST) are
      # SELF-ATTESTED: a developer who upgrades tldts, changes the rule set's
      # pslVersion, and updates both constants to match makes V-15 green
      # WITHOUT ever re-running conformance. Verified by seeding exactly that
      # case — V-15 reports OK. That is by design; V-15 gates whether the
      # pairing is DECLARED current, not whether the two PSLs agree.
      #
      # This step is the only thing that checks they actually agree. But
      # psl-reference.py exits 3 when tldextract is not importable, and the
      # test then degrades to comparing tldts against DEVELOPER-WRITTEN
      # expectations — no independent oracle. Without the install below, a
      # simultaneous update that also edited the expectation table would pass
      # CI with zero independent verification.
      #
      # The version is DERIVED from the rule set's own pslVersion rather than
      # hardcoded, so it cannot drift from what the rule set declares.
      # SSX_REQUIRE_PSL_ORACLE=1 turns the degrade path into a hard failure,
      # so CI can never silently fall back to the weaker mode.
      - name: 'G-8  PSL oracle (tldextract, version from pslVersion)'
        run: |
          VER=$(python3 -c "import json,re;print(re.search(r'tldextract==([0-9.]+)', json.load(open('rulesets/rules-v0.1.0.json'))['pslVersion']).group(1))")
          echo "Installing tldextract==$VER (declared in rulesets/rules-v0.1.0.json)"
          python3 -m pip install --quiet "tldextract==$VER"

      # ── DEC-32 — config-echo check (guards the DEFECT-34 class) ──────
      #
      # Asserts every conformance fixture makes an assertion about its ORACLE'S
      # CONFIGURATION. A fixture that never mentions its oracle's config cannot
      # be checking it, and may be comparing two library DEFAULTS to each other
      # -- passing while both differ from the producer, which is DEFECT-34.
      #
      # Necessary condition only; it cannot verify the config is CORRECT. The
      # load-bearing fix is tools/ci/psl-config.json single-sourcing the value.
      - name: 'DEC-32  Conformance fixtures assert their oracle config'
        run: npm run check:conformance-config

      - name: 'G-8  PSL boundary conformance (tldts vs tldextract)'
        env:
          SSX_REQUIRE_PSL_ORACLE: '1'
        run: npm run test:psl

      # ── G-11 — contract ↔ LDD conformance (DEC-4) ─────────────────────
      #
      # tools/ci/contract-conformance-check.py extracts canonical enums from
      # the D0.x TypeScript sources in packages/contracts/, compares against
      # storage enums pinned from the LDD (tools/ci/storage-enums.json,
      # digest-checked against the LDD on every run), applies the NM-1
      # mapping, and fails the build on any divergence. Named G-11 per DEC-4:
      # G-8 belongs to the rule-set static validator above. spec/ci.yml
      # contains no reference to contract-conformance-check.py — this step
      # wires it into CI for the first time. Runs the tools/ci/ working copy,
      # not spec/'s frozen original — spec/'s copy is BASE-anchored to its
      # own directory, which (since it lives in spec/) means it validates
      # against the six frozen pre-amendment contract .ts files also in
      # spec/, not the amended contracts this codebase actually builds
      # against.
      - name: 'G-11  Contract ↔ LDD conformance'
        run: python3 tools/ci/contract-conformance-check.py

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      # No unit-test suite exists yet — that's Stage 1b scope
      # (Stage0-Completion-Pack.md §6 does not list it for Stage 0). Placeholder
      # that no-ops honestly rather than failing on a script never meant to exist yet.
      - name: Unit tests
        run: npm test --if-present -- --coverage

      # ── G-9 — property tests (Stage 1b onward) ───────────────────────
      #
      # Suppression monotonicity; order-independence of maximum reduction;
      # aggravator neutralisation on parent suppression. Randomised over
      # generated finding sets, because these are the properties §4.3's
      # determinism guarantee actually rests on.
      # NO --if-present (DEFECT-29). The flag makes `npm run` exit 0 when the
      # script is absent, so G-9 would pass vacuously if `test:properties`
      # were ever removed from package.json — a gate that cannot fail is not
      # a gate (DEFECT-1's shape; DEFECT-17/V-14's principle). The script now
      # exists and is required to exist; its absence SHALL fail the build.
      # Contrast the "Unit tests" step above, whose --if-present is
      # deliberate and load-bearing: no `test` script exists yet by design.
      - name: 'G-9  Property tests'
        run: npm run test:properties

      # ── A1.1 — extension session survival (Stage 1c onward) ───────────
      #
      # Proves the MV3 service worker's Analysis Session state — including
      # §11.4's intervention lock — survives worker termination mid-session,
      # reconstructed from chrome.storage.session (shimmed) alone.
      # NO --if-present (DEFECT-29), same discipline as G-9 above: the flag
      # makes `npm run` exit 0 when the script is absent, so this would pass
      # vacuously if `test:extension` were ever removed from package.json. A
      # gate that cannot fail is not a gate. The script exists and is
      # required to exist; its absence SHALL fail the build.
      - name: 'A1.1  Extension session survival'
        run: npm run test:extension

      # ── A1.2 — live-DOM vs harness conformance (CP-3) ─────────────────
      - name: 'A1.2  loginInterface conformance (harness vs extension)'
        run: npm run test:conformance

      # ── A1.2 — CRED live-path: real extension collectors + engine ─────
      # Proves CRED-01 fires through the actual extension collection functions
      # on a valid off-origin login page, and correctly does NOT on localhost.
      # No --if-present (DEFECT-29): the script exists and must exist.
      - name: 'A1.2  CRED live-path (extension collectors -> engine)'
        run: npm run test:cred-livepath

      # ── A1.3 — Auth History Store poisoning guards G-01…G-05 ──────────
      # Exit criterion: guards unit-tested INCLUDING negative (reject) cases.
      # NO --if-present (DEFECT-29): same discipline as every gate above.
      - name: 'A1.3  Auth store guards G-01..G-05'
        run: npm run test:authstore

      # ── A1.4 — loginForm/javascript modules on extension evidence ─────
      # Deterministic; injectedAfterLoad observed for real (DEFECT-31 gain).
      - name: 'A1.4  Module evaluation on extension evidence'
        run: npm run test:moduleeval

      # ── A1.5 — authContext (ACEM) version-mismatch -> unevaluable ─────
      - name: 'A1.5  authContext version-mismatch integration'
        run: npm run test:authcontext

  boundary-violation-check:
    # Verifies the gates actually fail when they should. A gate that has never
    # failed is a gate nobody has tested.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      - name: Deliberate violation must be rejected
        run: |
          mkdir -p packages/engine/src/__gatecheck__
          cat > packages/engine/src/__gatecheck__/violation.ts <<'EOF'
          // Deliberate G-3 violation. CI must reject this.
          export const bad = () => (globalThis as any).window.location.href;
          EOF
          if node tools/ci/architectural-gates.mjs; then
            echo "::error::G-3 did not reject a deliberate violation"
            exit 1
          fi
          rm -rf packages/engine/src/__gatecheck__
          echo "Gates correctly rejected the violation."
